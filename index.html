<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EronFlow — Automated Payment Recovery & Invoice Reminders for B2B digital agencies." />
    <meta name="theme-color" content="#195280" />
    <title>EronFlow — Get Paid Faster. Stop Chasing Invoices.</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <!--
      Apply the saved (or OS-preferred) theme BEFORE React hydrates so there is
      no flash of the wrong color scheme on first paint. Reads the same key the
      ThemeToggle component writes, kept in sync at: src/components/ThemeToggle.tsx
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eron_theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
